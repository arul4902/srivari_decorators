<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Royal Plum to Deep Purple Background -->
    <radialGradient id="favMedallion" cx="35%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#8E14CE" />
      <stop offset="40%" stop-color="#550080" />
      <stop offset="75%" stop-color="#27002F" />
      <stop offset="100%" stop-color="#14001A" />
    </radialGradient>

    <!-- Warm Magenta Glow -->
    <radialGradient id="favMagenta" cx="75%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#E50065" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#E50065" stop-opacity="0" />
    </radialGradient>

    <!-- Champagne Gold Gradient -->
    <linearGradient id="favGold" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FFF6DD" />
      <stop offset="30%" stop-color="#E8CA82" />
      <stop offset="60%" stop-color="#D6B46A" />
      <stop offset="85%" stop-color="#B38734" />
      <stop offset="100%" stop-color="#FFF9EA" />
    </linearGradient>

    <!-- Magenta Ribbon -->
    <linearGradient id="favRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B8E" />
      <stop offset="100%" stop-color="#E50065" />
    </linearGradient>
  </defs>

  <!-- Base Crest Background -->
  <circle cx="64" cy="64" r="62" fill="url(#favMedallion)" />
  <circle cx="64" cy="64" r="62" fill="url(#favMagenta)" />

  <!-- Outer Luxury Gold Rim -->
  <circle cx="64" cy="64" r="60" fill="none" stroke="url(#favGold)" stroke-width="2.5" />
  <circle cx="64" cy="64" r="56" fill="none" stroke="url(#favGold)" stroke-width="0.8" stroke-dasharray="2 3" opacity="0.75" />

  <!-- Cardinal Gold Accent Dots -->
  <circle cx="64" cy="6" r="1.6" fill="#FFF6DD" />
  <circle cx="64" cy="122" r="1.6" fill="#FFF6DD" />
  <circle cx="6" cy="64" r="1.6" fill="#FFF6DD" />
  <circle cx="122" cy="64" r="1.6" fill="#FFF6DD" />

  <!-- Celebration Arch at Top -->
  <path d="M 40 40 C 46 26, 56 22, 64 22 C 72 22, 82 26, 88 40" 
        fill="none" stroke="url(#favGold)" stroke-width="1.4" stroke-linecap="round" opacity="0.8" />
  <!-- Apex Diamond Star -->
  <path d="M 64 15 L 66 19 L 70 20 L 66 21 L 64 25 L 62 21 L 58 20 L 62 19 Z" fill="url(#favGold)" />

  <!-- Lotus Pedestal Base -->
  <path d="M 64 108 C 60 102, 62 96, 64 92 C 66 96, 68 102, 64 108 Z" fill="url(#favGold)" />
  <path d="M 64 108 C 58 103, 54 98, 56 94 C 59 97, 62 103, 64 108 Z" fill="url(#favGold)" opacity="0.85" />
  <path d="M 64 108 C 70 103, 74 98, 72 94 C 69 97, 66 103, 64 108 Z" fill="url(#favGold)" opacity="0.85" />
  <path d="M 52 110 Q 64 112 76 110" stroke="url(#favGold)" stroke-width="1.2" stroke-linecap="round" fill="none" />

  <!-- Intertwined Magenta "D" Ribbon (Decorators) -->
  <path d="M 63 44 C 77 42, 90 52, 90 66 C 90 80, 77 88, 62 86" 
        fill="none" stroke="url(#favRibbon)" stroke-width="3" stroke-linecap="round" opacity="0.9" />

  <!-- Serif "S" Monogram (Srivari) -->
  <!-- Shadow -->
  <path d="M 51 52 C 51 44, 57 37, 66 37 C 74 37, 80 41, 80 48 C 80 54, 75 58, 68 61 C 58 65, 49 70, 49 80 C 49 90, 57 95, 68 95 C 77 95, 83 90, 84 83 L 79 82 C 78 87, 74 91, 67 91 C 60 91, 55 87, 55 80 C 55 74, 61 70, 70 66 C 80 62, 86 56, 86 47 C 86 38, 77 33, 65 33 C 53 33, 45 40, 45 52 Z" 
        fill="#120017" opacity="0.4" transform="translate(0.8, 1.2)" />

  <!-- Main Bold Serif S -->
  <path d="M 51 52 C 51 44, 57 37, 66 37 C 74 37, 80 41, 80 48 C 80 54, 75 58, 68 61 C 58 65, 49 70, 49 80 C 49 90, 57 95, 68 95 C 77 95, 83 90, 84 83 L 79 82 C 78 87, 74 91, 67 91 C 60 91, 55 87, 55 80 C 55 74, 61 70, 70 66 C 80 62, 86 56, 86 47 C 86 38, 77 33, 65 33 C 53 33, 45 40, 45 52 Z" 
        fill="url(#favGold)" />

  <!-- Teardrop Terminals -->
  <circle cx="48" cy="51" r="3.2" fill="url(#favGold)" />
  <circle cx="48" cy="51" r="1.6" fill="#FFF6DD" />
  <circle cx="82" cy="83" r="3.2" fill="url(#favGold)" />
  <circle cx="82" cy="83" r="1.6" fill="#FFF6DD" />

  <!-- Top Right Sparkle -->
  <path d="M 86 45 L 87.5 48 L 90.5 49.5 L 87.5 51 L 86 54 L 84.5 51 L 81.5 49.5 L 84.5 48 Z" fill="#FFF9EA" />
</svg>
